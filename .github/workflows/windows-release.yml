name: Windows installer
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: './src-tauri -> target' }
      - name: Download media and transcription tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/binaries'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          $ffmpegZip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile $ffmpegZip
          $ffmpegExtract = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Expand-Archive -Path $ffmpegZip -DestinationPath $ffmpegExtract -Force
          $ffmpegExe = Get-ChildItem $ffmpegExtract -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          $ffprobeExe = Get-ChildItem $ffmpegExtract -Filter ffprobe.exe -Recurse | Select-Object -First 1
          if (-not $ffmpegExe -or -not $ffprobeExe) { throw 'FFmpeg veya ffprobe bulunamadı' }
          Copy-Item $ffmpegExe.FullName (Join-Path $bin 'ffmpeg-x86_64-pc-windows-msvc.exe')
          Copy-Item $ffprobeExe.FullName (Join-Path $bin 'ffprobe-x86_64-pc-windows-msvc.exe')
          $dllDir = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/resources/binaries'
          New-Item -ItemType Directory -Force -Path $dllDir | Out-Null
          Get-ChildItem $ffmpegExe.DirectoryName -Filter *.dll | Copy-Item -Destination $dllDir -Force
          $ytDlpExe = Join-Path $bin 'yt-dlp-x86_64-pc-windows-msvc.exe'
          Invoke-WebRequest 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe' -OutFile $ytDlpExe
          $whisperZip = Join-Path $env:RUNNER_TEMP 'whisper.zip'
          Invoke-WebRequest 'https://github.com/ggml-org/whisper.cpp/releases/download/b5454/whisper-bin-x64.zip' -OutFile $whisperZip
          $whisperExtract = Join-Path $env:RUNNER_TEMP 'whisper'
          Expand-Archive -Path $whisperZip -DestinationPath $whisperExtract -Force
          $whisperExe = Get-ChildItem $whisperExtract -Filter whisper-cli.exe -Recurse | Select-Object -First 1
          if (-not $whisperExe) { throw 'whisper-cli.exe bulunamadı' }
          Copy-Item $whisperExe.FullName (Join-Path $bin 'whisper-cli-x86_64-pc-windows-msvc.exe')
          Get-ChildItem $whisperExtract -Filter *.dll -Recurse | Copy-Item -Destination $dllDir -Force
          & $ffmpegExe.FullName -version | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg başlatılamadı' }
          & $ffprobeExe.FullName -version | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'ffprobe başlatılamadı' }
          & $ytDlpExe --version
          if ($LASTEXITCODE -ne 0) { throw 'yt-dlp başlatılamadı' }
          & $whisperExe.FullName --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'whisper-cli başlatılamadı' }
          Get-ChildItem $bin,$dllDir -File | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize
      - run: npm ci
      - run: npm run tauri:build
      - name: Install and smoke-test bundled tools
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS kurulum dosyası bulunamadı' }
          $installDir = Join-Path $env:RUNNER_TEMP 'TamarilloSmoke'
          & $installer.FullName /S /CURRENTUSER "/D=$installDir"
          if ($LASTEXITCODE -ne 0) { throw "Tamarillo kurulumu başarısız: $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $installDir 'tamarillo.exe'))) {
            $installed = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Tamarillo' -ErrorAction SilentlyContinue
            if ($installed.InstallLocation) { $installDir = $installed.InstallLocation.Trim('"') }
          }
          Write-Output "Smoke test kurulum klasörü: $installDir"
          $required = @('Tamarillo.exe', 'ffmpeg.exe', 'ffprobe.exe', 'yt-dlp.exe', 'whisper-cli.exe')
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $installDir $_)) }
          if ($missing) { throw "Kurulum paketinde eksik dosyalar: $($missing -join ', ')" }
          $ffmpeg = Join-Path $installDir 'ffmpeg.exe'
          $ffprobe = Join-Path $installDir 'ffprobe.exe'
          $ytDlp = Join-Path $installDir 'yt-dlp.exe'
          $whisper = Join-Path $installDir 'whisper-cli.exe'
          & $ffmpeg -version | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Kurulan FFmpeg açılamadı' }
          & $ffprobe -version | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Kurulan ffprobe açılamadı' }
          & $ytDlp --version | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Kurulan yt-dlp açılamadı' }
          & $whisper --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Kurulan whisper-cli açılamadı' }
          $sample = Join-Path $env:RUNNER_TEMP 'tamarillo-smoke.mp4'
          $audio = Join-Path $env:RUNNER_TEMP 'tamarillo-smoke.mp3'
          & $ffmpeg -hide_banner -loglevel error -f lavfi -i 'color=c=black:s=64x64:d=0.2' -f lavfi -i 'sine=frequency=1000:duration=0.2' -shortest -c:v libx264 -c:a aac $sample -y
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $sample)) { throw 'Kurulan FFmpeg test videosunu oluşturamadı' }
          & $ffmpeg -hide_banner -loglevel error -i $sample -vn -c:a libmp3lame $audio -y
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $audio)) { throw 'Kurulan FFmpeg test videosundan MP3 çıkaramadı' }
      - uses: actions/upload-artifact@v4
        with:
          name: Tamarillo-Windows-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 90
  publish-release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Tamarillo-Windows-Setup
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.1
          target_commitish: ${{ github.sha }}
          files: release-assets/*.exe
          generate_release_notes: true
