name: Windows installer
on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: './src-tauri -> target' }
      - name: Download media tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/binaries'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          $ffmpegZip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile $ffmpegZip
          $ffmpegExtract = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Expand-Archive -Path $ffmpegZip -DestinationPath $ffmpegExtract -Force
          $ffmpegExe = Get-ChildItem $ffmpegExtract -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          $ffprobeExe = Get-ChildItem $ffmpegExtract -Filter ffprobe.exe -Recurse | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName (Join-Path $bin 'ffmpeg-x86_64-pc-windows-msvc.exe')
          Copy-Item $ffprobeExe.FullName (Join-Path $bin 'ffprobe-x86_64-pc-windows-msvc.exe')
          Invoke-WebRequest 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe' -OutFile (Join-Path $bin 'yt-dlp-x86_64-pc-windows-msvc.exe')
          Get-ChildItem $bin | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize
      - run: npm install
      - run: npm run tauri:build
      - uses: actions/upload-artifact@v4
        with:
          name: Tamarillo-Windows-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Tamarillo-Windows-Setup
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.exe
          generate_release_notes: true
